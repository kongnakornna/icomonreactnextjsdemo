services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: icmonweb-react-dev
    env_file:
      - .env
    ports:
      - "3010:1003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./public:/app/public
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: ./package.json

  production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: icmonweb-react
    ports:
      - "3010:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
